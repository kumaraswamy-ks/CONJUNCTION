const BANK=[
// word, type, category, meaning, kannada, example
['and','Coordinating','Addition','joins similar ideas','ಮತ್ತು','Ravi and Sita are friends.'],
['but','Coordinating','Contrast','shows opposite idea','ಆದರೆ','He is poor but honest.'],
['or','Coordinating','Choice','gives an alternative','ಅಥವಾ','Tea or coffee?'],
['nor','Coordinating','Negative choice','adds a negative idea','ಅಥವಾ ಇಲ್ಲ','He does not drink, nor does he smoke.'],
['for','Coordinating','Reason','because (formal)','ಏಕೆಂದರೆ','She smiled, for she was happy.'],
['yet','Coordinating','Contrast','but still','ಆದರೂ','It was late, yet he kept working.'],
['so','Coordinating','Result','therefore','ಆದ್ದರಿಂದ','It rained, so we stayed home.'],
['because','Subordinating','Reason','for the reason that','ಏಕೆಂದರೆ','I stayed home because I was ill.'],
['since','Subordinating','Reason / Time','because / from the time','ಏಕೆಂದರೆ / ಅಂದಿನಿಂದ','Since you are here, help me.'],

['whenever','Subordinating','Time','every time','ಯಾವಾಗಲಾದರೂ','Visit us whenever you like.'],

['once','Subordinating','Time','after / when','ಒಮ್ಮೆ','Once you finish, rest.'],
['if','Subordinating','Condition','on condition that','ಒಂದು ವೇಳೆ','If it rains, we will stay in.'],
['unless','Subordinating','Condition','if not','ಹೊರತು','You will fail unless you study.'],
['provided that','Subordinating','Condition','only if','ಎಂಬ ಷರತ್ತಿನ ಮೇಲೆ','You may go provided that you return early.'],

// Question templates: [sentence with ___, answer, distractors, explanation, level]
const NAMES=['Ravi','Sita','Anil','Meena','Kiran','Asha','Rahul','Divya','Arjun','Pooja','Manoj','Lakshmi','Vijay','Kavya','Suresh','Nisha','Deepak','Rekha','Ganesh','Shwetha'];
const T=[
['{N} was tired, ___ he kept working.','yet',['so','or','because'],'"yet" shows contrast: tired but still working.','B'],
['{N} missed the bus ___ {N} woke up late.','because',['but','unless','so'],'"because" gives the reason.','B'],
['It was raining, ___ {N} took an umbrella.','so',['but','or','although'],'"so" shows the result.','B'],
['Would {N} like tea ___ coffee?','or',['and','but','so'],'"or" offers a choice.','B'],
['{N} is poor ___ honest.','but',['and','so','or'],'"but" joins contrasting ideas.','B'],
['{N} plays cricket ___ football.','and',['but','nor','yet'],'"and" adds similar ideas.','B'],
['{N} does not eat meat, ___ does {N} eat eggs.','nor',['or','and','so'],'After a negative clause, "nor" adds another negative.','I'],
['{N} will fail ___ {N} studies hard.','unless',['if','because','since'],'"unless" = if not.','I'],
['___ it was cold, {N} went for a walk.','Although',['Because','Unless','So'],'"Although" shows contrast.','I'],
['Wait here ___ {N} returns.','until',['unless','because','although'],'"until" = up to the time.','B'],
['{N} saved money ___ {N} could buy a bicycle.','so that',['because','unless','although'],'"so that" shows purpose.','I'],
['Call me ___ {N} reaches home.','as soon as',['unless','although','so'],'"as soon as" = immediately when.','I'],
['{N} is taller ___ his brother.','than',['then','as','that'],'Use "than" for comparison.','B'],
['___ {N} nor his friend came to class.','Neither',['Either','Both','Not'],'Correlative pair: neither…nor.','I'],
['___ {N} or Sita will win the prize.','Either',['Neither','Both','Whether'],'Correlative pair: either…or.','I'],
['___ {N} and Ravi are good singers.','Both',['Either','Neither','Not only'],'Correlative pair: both…and.','B'],
['{N} is not only clever ___ hardworking.','but also',['and also','as well','but'],'Correlative pair: not only…but also.','I'],
['No sooner had {N} arrived ___ it started raining.','than',['when','then','that'],'"No sooner" pairs with "than".','A'],
['Hardly had {N} sat down ___ the bell rang.','when',['than','then','that'],'"Hardly" pairs with "when".','A'],
['{N} was so tired ___ he fell asleep.','that',['than','as','so'],'so…that shows result.','I'],
['Walk carefully ___ you should fall.','lest',['unless','until','if'],'"lest" = for fear that; takes "should".','A'],
['Take an umbrella ___ it rains.','in case',['unless','so','although'],'"in case" = as a precaution.','I'],
['{N} read a book ___ waiting for the train.','while',['because','unless','so'],'"while" = during the time.','B'],
['{N} likes summer, ___ his sister prefers winter.','whereas',['because','so','unless'],'"whereas" contrasts two facts.','I'],
['I don\'t know ___ {N} will come or not.','whether',['if','that','unless'],'"whether…or not" is correct.','I'],
['{N} said ___ he was busy.','that',['than','what','because'],'"that" introduces a reported clause.','B'],
['Sit ___ you like, {N}.','wherever',['whenever','whatever','unless'],'"wherever" = any place.','I'],
['___ {N} finished homework, he went out to play.','After',['Unless','Although','Lest'],'"After" shows time sequence.','B'],
['{N} brushed his teeth ___ going to bed.','before',['unless','because','so'],'"before" = earlier than.','B'],
['{N} has lived here ___ 2015.','since',['for','from','until'],'"since" + point of time.','I'],
['{N} would rather walk ___ take the bus.','than',['then','or','but'],'rather…than shows preference.','I'],
['{N} is as clever ___ his sister.','as',['than','so','like'],'as…as shows equality.','B'],
['You may go out ___ you finish your work first.','provided that',['unless','although','lest'],'"provided that" = only if.','A'],
['The road was wet; ___, {N} drove slowly.','therefore',['however','but','although'],'"therefore" (conjunctive adverb) shows result.','A'],
['The phone was costly; ___, {N} bought it.','however',['therefore','because','so'],'"however" shows contrast.','A'],
['{N} stayed home, ___ he was ill.','for',['so','yet','or'],'"for" (FANBOYS) gives reason, formal.','I'],
['___ {N} works hard, he will succeed.','If',['Unless','Although','Lest'],'"If" introduces a condition.','B'],
['{N} smiled ___ she heard the news.','when',['unless','than','although'],'"when" = at the time that.','B'],
['Whether {N} wins ___ loses, he will play fair.','or',['nor','and','but'],'whether…or is a correlative pair.','I'],

['{N} will help you ___ you ask him.','if',['unless','lest','though'],'Condition.','B'],
['Do not go out ___ it stops raining, {N}.','until',['unless','because','since'],'Time limit: until.','I'],

['Although he was ill, but he attended school.','Although he was ill, he attended school.','Do not use "but" with "although".'],
['Neither Ram or Shyam came.','Neither Ram nor Shyam came.','neither pairs with nor.'],

/* ================== LESSONS ================== */
const L=[
['What is a Conjunction?','ಸಂಯೋಜಕ ಎಂದರೇನು?',`A <b>conjunction</b> is a word that <b>joins</b> words, phrases or clauses. <span class="kn">ಪದಗಳು, ಪದಗುಚ್ಛಗಳು ಅಥವಾ ವಾಕ್ಯಾಂಶಗಳನ್ನು ಜೋಡಿಸುವ ಪದವೇ ಸಂಯೋಜಕ.</span><ul><li>Words: bread <span class="hl">and</span> butter</li><li>Phrases: in the house <span class="hl">or</span> in the garden</li><li>Clauses: I came <span class="hl">because</span> you called.</li></ul>`],
['Three Main Types','ಮೂರು ಮುಖ್ಯ ವಿಧಗಳು',`<table><tr><th>Type</th><th>Function</th><th>Examples</th></tr><tr><td>Coordinating</td><td>Joins equal parts</td><td>for, and, nor, but, or, yet, so</td></tr><tr><td>Subordinating</td><td>Joins a dependent clause to a main clause</td><td>because, although, if, when, unless</td></tr><tr><td>Correlative</td><td>Work in pairs</td><td>either…or, neither…nor, both…and</td></tr></table><p class="kn">ಸಮಾನ ಜೋಡಕ, ಅಧೀನ ಜೋಡಕ, ಜೋಡಿ ಜೋಡಕ</p>`],
['FANBOYS','FANBOYS ನೆನಪಿನ ಸೂತ್ರ',`<p>The 7 coordinating conjunctions: <b>F</b>or • <b>A</b>nd • <b>N</b>or • <b>B</b>ut • <b>O</b>r • <b>Y</b>et • <b>S</b>o</p><p>Rule: Put a <b>comma before</b> FANBOYS when it joins two independent clauses: <i>It rained<span class="hl">, so</span> we stayed in.</i></p><p class="kn">ಎರಡು ಸ್ವತಂತ್ರ ವಾಕ್ಯಗಳನ್ನು ಜೋಡಿಸುವಾಗ ಅಲ್ಪವಿರಾಮ ಬಳಸಿ.</p>`],
['Subordinating Conjunctions by Meaning','ಅರ್ಥದ ಪ್ರಕಾರ ಅಧೀನ ಜೋಡಕಗಳು',`<table><tr><th>Meaning</th><th>Conjunctions</th></tr><tr><td>Time</td><td>when, while, before, after, until, since, as soon as</td></tr><tr><td>Reason</td><td>because, since, as</td></tr><tr><td>Condition</td><td>if, unless, provided that, in case</td></tr><tr><td>Contrast</td><td>although, though, even though, whereas, while</td></tr><tr><td>Purpose</td><td>so that, in order that, lest</td></tr><tr><td>Result</td><td>so…that, such…that</td></tr><tr><td>Comparison</td><td>than, as…as</td></tr><tr><td>Place</td><td>where, wherever</td></tr></table>`],
['Correlative Conjunctions','ಜೋಡಿ ಸಂಯೋಜಕಗಳು',`<p>Always used in pairs and must join <b>parallel</b> (same-type) elements.</p><ul><li>either…or / neither…nor / both…and</li><li>not only…but also / whether…or</li><li>no sooner…than / hardly…when / scarcely…when</li></ul><p>✗ He not only is kind but also smart. ✓ He is not only kind but also smart.</p>`],
['Clauses & Sentence Types','ವಾಕ್ಯಾಂಶ ಮತ್ತು ವಾಕ್ಯ ಪ್ರಕಾರಗಳು',`<ul><li><b>Simple:</b> one main clause. <i>I play.</i></li><li><b>Compound:</b> two main clauses + coordinating conjunction. <i>I play, and she sings.</i></li><li><b>Complex:</b> main clause + subordinate clause. <i>I play when I am free.</i></li><li><b>Compound-complex:</b> both. <i>I play when I am free, but she studies.</i></li></ul><p class="kn">ಸರಳ, ಸಂಯುಕ್ತ, ಮಿಶ್ರ ವಾಕ್ಯಗಳು</p>`],
['Conjunction vs Preposition vs Adverb','ಸಂಯೋಜಕ vs ಉಪಸರ್ಗ',`<table><tr><th>Word</th><th>Conjunction (+clause)</th><th>Preposition (+noun)</th></tr><tr><td>before</td><td>Eat before you go.</td><td>Come before noon.</td></tr><tr><td>after</td><td>He left after we ate.</td><td>After lunch, rest.</td></tr><tr><td>since</td><td>Since it rained, we stayed.</td><td>Since Monday.</td></tr><tr><td>because / because of</td><td>because it rained</td><td>because of the rain</td></tr><tr><td>although / despite</td><td>although it rained</td><td>despite the rain</td></tr></table><p><b>Conjunctive adverbs</b> (however, therefore, moreover) need a semicolon: <i>It was late; however, he came.</i></p>`],
['Subject–Verb Agreement','ಕರ್ತೃ–ಕ್ರಿಯಾಪದ ಹೊಂದಾಣಿಕೆ',`<ul><li><b>and</b> → plural: Ravi and Sita <b>are</b> here.</li><li><b>either/neither…or/nor</b> → verb agrees with nearer subject: Neither the boys nor the teacher <b>is</b> here.</li><li><b>not only…but also</b> → nearer subject: Not only he but also his friends <b>were</b> late.</li><li><b>as well as / along with</b> → first subject: The teacher as well as students <b>is</b> present.</li></ul>`],
['Common Errors','ಸಾಮಾನ್ಯ ತಪ್ಪುಗಳು',`<ul><li>✗ Although…but → ✓ Although… (no but)</li><li>✗ Because…so → ✓ Because… (no so)</li><li>✗ Unless…not → ✓ Unless… (already negative)</li><li>✗ lest…will → ✓ lest…should</li><li>✗ No sooner…when → ✓ No sooner…than</li><li>✗ Hardly…than → ✓ Hardly…when</li><li>✗ The reason is because → ✓ The reason is that</li></ul>`],
['Exam Tips','ಪರೀಕ್ಷಾ ಸಲಹೆಗಳು',`<ol><li>Identify the relation: addition, contrast, reason, result, time, condition.</li><li>Check for pair partners (neither→nor).</li><li>Never use double conjunctions.</li><li>"No sooner/Hardly/Scarcely" at the start cause inversion: <i>Hardly <b>had I</b>…</i></li><li>Check verb agreement with correlatives.</li></ol>`],
];

/* ================== QUIZ ENGINE ================== */
let QZ={};
function startQuiz(box,qs,opt={}){
  QZ[box]={qs,i:0,score:0,ans:[],timed:opt.timed,title:opt.title||'Quiz',key:opt.key,noFb:opt.noFb,start:Date.now()};
  renderQ(box);
}
function renderQ(box){
  const z=QZ[box],el=document.getElementById(box);
  if(z.i>=z.qs.length)return finishQuiz(box);
  const q=z.qs[z.i];
  el.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${esc(z.title)}</b><span>Q ${z.i+1}/${z.qs.length} • Score ${z.score}</span></div>
  <div class="bar" style="margin:8px 0"><i style="width:${z.i/z.qs.length*100}%"></i></div>
  <p style="font-size:1.1rem">${q.err?'Choose the correct sentence:<br><i>'+esc(q.s)+'</i>':esc(q.s).replace('___','<b class="hl">_____</b>')} ${sp(q.s.replace('___','blank'))}</p>
  ${q.o.map(o=>`<button class="opt" onclick="pick('${box}',this)" data-v="${esc(o)}">${esc(o)}</button>`).join('')}
  <div class="fbx"></div></div>`;
}
function pick(box,btn){
  const z=QZ[box],q=z.qs[z.i],v=btn.dataset.v,ok=v===q.a,el=document.getElementById(box);
  el.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.v===q.a)b.classList.add('ok')});
  if(!ok)btn.classList.add('bad');
  z.ans.push({id:q.id,v,ok});if(ok)z.score++;
  P.att++;if(ok){P.cor++;P.done[q.id]=1;P.mist=P.mist.filter(x=>x!==q.id)}else if(!P.mist.includes(q.id))P.mist.push(q.id);
  save();
  const nx=`<button class="btn" onclick="QZ['${box}'].i++;renderQ('${box}')">Next →</button>`;
  if(z.noFb){z.i++;return setTimeout(()=>renderQ(box),250)}
  el.querySelector('.fbx').innerHTML=`<div class="fb">${ok?'✅ Correct!':'❌ Correct answer: <b>'+esc(q.a)+'</b>'}<br>💡 ${esc(q.e)}</div>${nx}`;
}
function finishQuiz(box){
  const z=QZ[box],pc=Math.round(z.score/z.qs.length*100),t=Math.round((Date.now()-z.start)/1000);
  if(z.key){P.best[z.key]=Math.max(P.best[z.key]||0,pc);save()}
  const wrong=z.ans.filter(a=>!a.ok).map(a=>qById[a.id]);
  document.getElementById(box).innerHTML=`<div class="card" style="text-align:center"><h3>${esc(z.title)} – Result</h3><div class="stat">${z.score}/${z.qs.length} (${pc}%)</div><p>Time: ${t}s • ${pc>=90?'🌟 Excellent! Master level':pc>=70?'👍 Good work':pc>=50?'🙂 Keep practising':'📖 Revise the lessons and try again'}</p>
  <button class="btn" onclick="startQuiz('${box}',shuffle(QZ['${box}'].qs),{title:QZ['${box}'].title,key:QZ['${box}'].key,noFb:QZ['${box}'].noFb})">Retry</button></div>
  ${wrong.length?'<div class="card"><h3>Review</h3>'+wrong.map(q=>`<p>• ${esc(q.s)}<br>✔ <b>${esc(q.a)}</b> — ${esc(q.e)}</p>`).join('')+'</div>':''}`;
}
const pickQ=(n,f=()=>true)=>shuffle(Q.filter(f)).slice(0,n);

function cloze(){const items=[['Ravi wanted to go out, ___ it was raining heavily.','but'],['He took his umbrella ___ he did not want to get wet.','because'],['___ he reached the bus stop, the bus had left.','When'],['He waited ___ the next bus came.','until'],['He was late, ___ his teacher forgave him.','yet'],['He promised to leave early ___ he would never be late again.','so that']];
$('#pq').innerHTML=`<div class="card"><h3>Cloze Passage</h3><p>Type the missing conjunctions.</p>${items.map((x,i)=>`<p>${i+1}. ${x[0].replace('___',`<input type="text" id="cz${i}" style="width:130px;display:inline-block" aria-label="Blank ${i+1}">`)}</p>`).join('')}<button class="btn" onclick="checkCloze(${JSON.stringify(items.map(x=>x[1])).replace(/"/g,'&quot;')})">Check</button><div id="czr"></div></div>`}
function checkCloze(a){let s=0;a.forEach((x,i)=>{const el=$('#cz'+i),ok=el.value.trim().toLowerCase()==x.toLowerCase();el.style.borderColor=ok?'var(--ok)':'var(--bad)';if(!ok)el.title='Answer: '+x;s+=ok});P.att+=a.length;P.cor+=s;save();$('#czr').innerHTML=`<div class="fb">Score: ${s}/${a.length}. Answers: ${a.join(', ')}</div>`}
let tci=0;function typeCorr(){const e=ERR[tci%ERR.length];$('#tc').innerHTML=`<p><i>${esc(e[0].replace(/^.*?—/,''))}</i></p><input type="text" id="tci" placeholder="Type the corrected sentence"><button class="btn" onclick="chkTC()">Check</button><button class="btn ghost" onclick="tci++;typeCorr()">Skip</button><div id="tco"></div>`}
function chkTC(){const e=ERR[tci%ERR.length],n=s=>s.toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim(),ok=n($('#tci').value)==n(e[1]);P.att++;if(ok)P.cor++;save();$('#tco').innerHTML=`<div class="fb">${ok?'✅ Perfect!':'Model answer: <b>'+esc(e[1])+'</b>'}<br>💡 ${esc(e[2])}</div><button class="btn" onclick="tci++;typeCorr()">Next →</button>`}
function build(){const a=$('#c1').value.trim().replace(/[.]$/,''),c=$('#cj').value,b=$('#c2').value.trim().replace(/[.]$/,''),info=BANK.find(x=>x[0]==c);let s;
if(info[1]=='Conjunctive adverb')s=`${a}; ${c}, ${b}.`;else if(info[1]=='Coordinating')s=`${a}, ${c} ${b}.`;else s=`${a} ${c} ${b}.`;
const alt=info[1]=='Subordinating'?`<br>Alternative: ${c[0].toUpperCase()+c.slice(1)} ${b}, ${a[0].toLowerCase()+a.slice(1)}.`:'';
$('#bo').innerHTML=`<b>${esc(s)}</b> ${sp(s)}${esc(alt)}<br><small>${info[1]} • ${info[2]} • ${info[3]} <span class="kn">(${info[4]})</span></small>`}
function finder(){const words=BANK.map(b=>b[0]).filter(w=>!w.includes('…')).sort((a,b)=>b.length-a.length);let t=esc($('#ft').value),found=[];
words.forEach(w=>{const re=new RegExp('\\b('+w+')\\b(?![^<]*>)','gi');t=t.replace(re,m=>{found.push(w);return`<span class="hl">${m}</span>`})});
$('#fo').innerHTML=t+`<br><small>Found: ${[...new Set(found)].join(', ')||'none'}</small>`}
const PZ=['I stayed home because I was ill','She is poor but she is honest','Neither Ravi nor Sita came today','Take an umbrella in case it rains','He ran fast so that he could win','Call me as soon as you arrive'];let pzi=0,pzSel=[];
function puzzle(){const s=PZ[pzi%PZ.length];pzSel=[];const w=shuffle(s.split(' '));$('#wp').innerHTML=`<p>Arrange the words:</p><div id="pw">${w.map((x,i)=>`<span class="chip" onclick="pzAdd(this)">${x}</span>`).join('')}</div><p id="pa" class="fb">&nbsp;</p><button class="btn" onclick="pzChk()">Check</button><button class="btn ghost" onclick="puzzle()">Reset</button><button class="btn ghost" onclick="pzi++;puzzle()">Next</button><div id="pr"></div>`}
function pzAdd(el){pzSel.push(el.textContent);el.remove();$('#pa').textContent=pzSel.join(' ')}
function pzChk(){const ok=pzSel.join(' ')==PZ[pzi%PZ.length];$('#pr').innerHTML=`<div class="fb">${ok?'✅ Correct!':'❌ Answer: '+PZ[pzi%PZ.length]}</div>`}
function dailyGo(d){startQuiz('dq',window._dq,{title:'Daily Challenge'});const orig=finishQuiz;window.finishQuiz=function(box){orig(box);if(box=='dq'){const z=QZ.dq,pc=Math.round(z.score/z.qs.length*100);if(!P.daily[d]){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);P.streak=P.last==y?(P.streak||0)+1:1;P.last=d}P.daily[d]=Math.max(P.daily[d]||0,pc);save()}window.finishQuiz=orig}}
function paper(n){let seed=n*9973;const r=()=>(seed=seed*16807%2147483647)/2147483647;return[...Q].sort(()=>r()-.5).slice(0,25)}
function printSheet(title,lv,n){const qs=lv=='E'?shuffle(Q.filter(q=>q.err)).slice(0,n):pickQ(n,q=>q.l==lv&&!q.err);
$('#printArea').innerHTML=`<h2>KS LEARNING CENTER<br><small>Conjunction – ${title}</small></h2><p>Name: ____________________ Date: __________ Score: ____/${n}</p>${qs.map((q,i)=>`<div class="pq">${i+1}. ${lv=='E'?'Correct the sentence: '+esc(q.s)+'<br>_______________________________________':esc(q.s).replace('___','________')+'<br>&nbsp;&nbsp;('+q.o.map((o,j)=>'abcd'[j]+') '+esc(o)).join('&nbsp;&nbsp;')+')'}</div>`).join('')}<div style="page-break-before:always"><h3>Answer Key</h3>${qs.map((q,i)=>`${i+1}. ${esc(q.a)}`).join('<br>')}</div>`;window.print()}
function printNotes(){$('#printArea').innerHTML=`<h2>KS LEARNING CENTER<br><small>Conjunction – Complete Notes</small></h2>`+L.map((l,i)=>`<h3>${i+1}. ${l[0]}</h3>${l[2]}`).join('');window.print()}
